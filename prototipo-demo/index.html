<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SutuyWeb · prototipo navegable</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
/* ==== frontend/src/estilos/tokens.css ==== */
/* SutuWeb — Sistema de Diseño Unificado (Tokens + Header) */
:root,
[data-theme="light"] {
  --primary: #0b3b75;
  --on-primary: #ffffff;
  --primary-container: #d6e4f7;
  --on-primary-container: #0b3b75;
  --secondary: #1f4e8a;
  --on-secondary: #ffffff;
  --secondary-container: #e2eaf3;
  --on-secondary-container: #14243a;
  --error: #b42318;
  --on-error: #ffffff;
  --error-container: #fdecea;
  --on-error-container: #7a1a12;
  --warning: #8a5300;
  --on-warning: #ffffff;
  --warning-container: #fff1d6;
  --on-warning-container: #5c3700;
  --success: #2f7d07;
  --on-success: #ffffff;
  --success-container: #ebf6e3;
  --on-success-container: #1e5104;
  --background: #f9fbfd;
  --surface: #f9fbfd;
  --on-surface: #14243a;
  --on-surface-variant: #4a5b70;
  --surface-container-lowest: #ffffff;
  --surface-container-low: #f4f7fb;
  --surface-container: #eef3f8;
  --surface-container-high: #e2eaf3;
  --surface-container-highest: #d8e2ee;
  --outline: #7a8ba0;
  --outline-variant: #cfdbe8;
  --inverse-surface: #14243a;
  --inverse-on-surface: #f1f4f9;
  --inverse-primary: #a8c8ff;
  --nav-surface: #0b3b75;
  --nav-surface-dark: #072852;
  --on-nav-surface: #e8f0fa;
  --on-nav-surface-muted: rgba(232, 240, 250, 0.75);
  --nav-indicator: #4fa3e0;
  --on-nav-indicator: #ffffff;
  --focus-ring: #0563c1;
  --data-blue: #0563c1;
  --data-orange: #eb6834;
  --data-green: #1bb079;
  --data-red: #d03c3c;
  --elevation-0: none;
  --elevation-1: 0 1px 2px rgba(20, 36, 58, 0.18), 0 1px 3px 1px rgba(20, 36, 58, 0.10);
  --elevation-2: 0 1px 2px rgba(20, 36, 58, 0.18), 0 2px 6px 2px rgba(20, 36, 58, 0.10);
  --elevation-3: 0 4px 8px 3px rgba(20, 36, 58, 0.10), 0 1px 3px rgba(20, 36, 58, 0.18);
}

[data-theme="dark"] {
  --primary: #a8c8ff;
  --on-primary: #00315f;
  --primary-container: #0e4a8c;
  --on-primary-container: #d6e4ff;
  --secondary: #a9c3e6;
  --on-secondary: #0a2340;
  --secondary-container: #263a55;
  --on-secondary-container: #d6e4ff;
  --error: #ffb4ab;
  --on-error: #690005;
  --error-container: #7a1a12;
  --on-error-container: #ffdad6;
  --warning: #f2be6b;
  --on-warning: #422800;
  --warning-container: #5c3700;
  --on-warning-container: #ffddb0;
  --success: #9ad67a;
  --on-success: #0f3800;
  --success-container: #1e5104;
  --on-success-container: #cdefb8;
  --background: #0f1724;
  --surface: #0f1724;
  --on-surface: #e3eaf3;
  --on-surface-variant: #b4c2d3;
  --surface-container-lowest: #0a111c;
  --surface-container-low: #131d2b;
  --surface-container: #172231;
  --surface-container-high: #1f2c3d;
  --surface-container-highest: #283648;
  --outline: #8696aa;
  --outline-variant: #3a4a5e;
  --inverse-surface: #e3eaf3;
  --inverse-on-surface: #14243a;
  --inverse-primary: #0563c1;
  --nav-surface: #0a1a30;
  --nav-surface-dark: #06101f;
  --on-nav-surface: #e8f0fa;
  --on-nav-surface-muted: rgba(232, 240, 250, 0.72);
  --nav-indicator: #1f4e8a;
  --on-nav-indicator: #ffffff;
  --focus-ring: #a8c8ff;
  --data-blue: #4c93e6;
  --data-orange: #f08a5d;
  --data-green: #3cc890;
  --data-red: #e86464;
  --elevation-1: 0 1px 2px rgba(0, 0, 0, 0.5), 0 1px 3px 1px rgba(0, 0, 0, 0.3);
  --elevation-2: 0 1px 2px rgba(0, 0, 0, 0.5), 0 2px 6px 2px rgba(0, 0, 0, 0.3);
  --elevation-3: 0 4px 8px 3px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.5);
}

:root {
  --header-h: 64px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --shape-corner-none: 0px;
  --shape-corner-extra-small: 4px;
  --shape-corner-small: 8px;
  --shape-corner-medium: 12px;
  --shape-corner-large: 16px;
  --shape-corner-extra-large: 28px;
  --shape-corner-full: 9999px;
  --font-sans: "Inter", "Source Sans 3", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --text-headline-medium: 700 28px/36px var(--font-sans);
  --text-headline-small: 700 24px/32px var(--font-sans);
  --text-title-large: 700 22px/28px var(--font-sans);
  --text-title-medium: 700 16px/24px var(--font-sans);
  --text-title-small: 600 14px/20px var(--font-sans);
  --text-body-large: 400 16px/24px var(--font-sans);
  --text-body-medium: 400 14px/20px var(--font-sans);
  --text-body-small: 400 12px/16px var(--font-sans);
  --text-label-large: 600 14px/20px var(--font-sans);
  --text-label-medium: 600 12px/16px var(--font-sans);
  --text-label-status: 700 12px/16px var(--font-sans);
  --text-code-medium: 400 13px/20px var(--font-mono);
  --text-code-large: 500 18px/24px var(--font-mono);
}

/* ===== CLASES TIPOGRÁFICAS ===== */
.headline-medium {
  font: var(--text-headline-medium);
  letter-spacing: -0.01em;
}

.headline-small {
  font: var(--text-headline-small);
}

.title-large {
  font: var(--text-title-large);
}

.title-medium {
  font: var(--text-title-medium);
  letter-spacing: 0.009em;
}

.title-small {
  font: var(--text-title-small);
  letter-spacing: 0.007em;
}

.body-large {
  font: var(--text-body-large);
}

.body-medium {
  font: var(--text-body-medium);
}

.body-small {
  font: var(--text-body-small);
}

.label-large {
  font: var(--text-label-large);
  letter-spacing: 0.007em;
}

.label-medium {
  font: var(--text-label-medium);
  letter-spacing: 0.04em;
}

.label-status {
  font: var(--text-label-status);
  letter-spacing: 0.08em;
}

.code-medium {
  font: var(--text-code-medium);
}

.code-large {
  font: var(--text-code-large);
}

/* ===== HEADER INSTITUCIONAL (SUTUYWEB) ===== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--header-h);
  font-family: var(--font-sans);
  background: linear-gradient(90deg, var(--nav-surface-dark), var(--nav-surface));
  box-shadow: var(--elevation-2);
}

.app-header__inner {
  height: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 var(--space-6);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
}

.brand {
  display: flex;
  align-items: center;
  gap: 18px;
  min-width: 0;
  height: 100%;
  text-decoration: none;
  color: var(--on-nav-surface);
}

/* Placa blanca pegada a la izquierda con corte diagonal */
.brand__plate {
  position: relative;
  flex-shrink: 0;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0 44px 0 var(--space-6);
  margin-left: calc(var(--space-6) * -1);
  background: #ffffff;
  clip-path: polygon(0 0, 100% 0, calc(100% - 28px) 100%, 0 100%);
}

/* Franja celeste de acento en el borde diagonal */
.brand__plate::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent calc(100% - 34px), var(--nav-indicator) calc(100% - 34px));
  clip-path: polygon(calc(100% - 6px) 0, 100% 0, calc(100% - 28px) 100%, calc(100% - 34px) 100%);
}

.brand__logo {
  height: 48px;
  width: auto;
  max-width: 150px;
  object-fit: contain;
  display: block;
}

.brand__text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.2;
}

.brand__app {
  font: var(--text-label-medium);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--on-nav-surface-muted);
}

.brand__company {
  font: var(--text-title-medium);
  color: var(--on-nav-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Botones de acción (Notificaciones y Salir) */
.actions {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex-shrink: 0;
}

.icon-btn,
.logout-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: 40px;
  border: 0;
  border-radius: var(--shape-corner-small);
  background: transparent;
  color: var(--on-nav-surface);
  font: var(--text-label-large);
  cursor: pointer;
  transition: background 0.15s ease;
}

.icon-btn {
  width: 40px;
}

.logout-btn {
  padding: 0 14px;
}

.icon-btn:hover,
.logout-btn:hover {
  background: rgba(255, 255, 255, 0.12);
}

.icon-btn:focus-visible,
.logout-btn:focus-visible {
  outline: 2px solid var(--on-nav-surface);
  outline-offset: 2px;
}

.icon-btn svg,
.logout-btn svg {
  width: 20px;
  height: 20px;
}

.badge {
  position: absolute;
  top: 6px;
  right: 6px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: var(--shape-corner-small);
  background: var(--data-red);
  color: #ffffff;
  font-size: 10px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
  box-shadow: 0 0 0 2px var(--nav-surface);
}

.actions__sep {
  width: 1px;
  height: 24px;
  background: rgba(255, 255, 255, 0.25);
  margin: 0 var(--space-2);
}

/* Adaptación móvil del Header */
@media (max-width: 640px) {
  .app-header__inner {
    padding: 0 var(--space-3);
  }

  .brand__app {
    display: none;
  }

  .brand__plate {
    margin-left: calc(var(--space-3) * -1);
    padding: 0 30px 0 var(--space-3);
    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
  }

  .brand__plate::after {
    display: none;
  }

  .brand__logo {
    height: 40px;
    max-width: 96px;
  }

  .brand__company {
    font-size: 14px;
  }

  .logout-btn {
    width: 40px;
    padding: 0;
  }

  .logout-btn span {
    display: none;
  }

  .actions__sep {
    display: none;
  }
}

/* ===== AJUSTE PARA STREAMLIT (Ocultar barra nativa si usas el header propio) ===== */
[data-testid="stHeader"] {
  display: none !important;
}

.block-container {
  padding-top: 0 !important;
}
/* ==== frontend/src/estilos/globales.css ==== */
/* Estilos base. Campos según SDD-UX-001 (DEC-UX-001 a DEC-UX-003). */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--surface); color: var(--on-surface); font: var(--text-body-large); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* Campo de texto: 48px de alto, texto de 16px, padding de 16px y borde completo de contraste >= 3:1 */
.campo { display: grid; gap: 6px; min-width: 0; font: 500 14px/20px var(--font-sans); color: var(--on-surface); }
.campo input {
  width: 100%; min-width: 0; height: 48px; padding: 0 var(--space-4);
  font: var(--text-body-large); font-size: max(1rem, 16px); color: var(--on-surface);
  background: var(--surface-container-lowest); border: 1px solid var(--on-surface-variant);
  border-radius: var(--shape-corner-small);
}
.campo input:focus-visible { border-color: var(--primary); outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.campo input[aria-invalid="true"] { border-color: var(--error); }

/* Campo de clave con botón de mostrar u ocultar de 44x44px */
.campo__clave {
  display: flex; align-items: center; height: 48px; padding-left: var(--space-4);
  background: var(--surface-container-lowest); border: 1px solid var(--on-surface-variant);
  border-radius: var(--shape-corner-small);
}
.campo__clave:focus-within { border-color: var(--primary); outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.campo__clave input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: none; background: transparent; }
/* El contorno lo dibuja .campo__clave:focus-within; el campo interno no lleva el suyo */
.campo__clave input:focus-visible { border: 0; outline: none; }
.campo__clave .sw-iconbtn {
  width: 44px; height: 44px; min-width: 44px; min-height: 44px; flex: none;
  display: grid; place-items: center; border: 0; border-radius: var(--shape-corner-full);
  background: transparent; color: var(--on-surface-variant); cursor: pointer;
}
.campo__clave .sw-iconbtn:hover { background: var(--surface-container); }

.boton {
  min-height: 48px; padding: 0 var(--space-6); border-radius: var(--shape-corner-full);
  border: 1.5px solid var(--primary); background: var(--primary); color: var(--on-primary);
  font: var(--text-label-large); cursor: pointer;
}
.boton:disabled { opacity: 0.6; cursor: wait; }

.aviso-error { color: var(--error); font: var(--text-body-medium); }
.ms { font-family: "Material Symbols Outlined"; font-size: 24px; line-height: 1; font-weight: normal; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ==== frontend/src/estilos/ingreso.css ==== */
/* ---------- Ingreso (SDD-UX-001) ---------- */
/* Columna única centrada sobre --surface, formulario de máximo 400px */
.login { min-height: 100vh; display: grid; place-items: center; background: var(--surface); }
.login__form { width: 100%; max-width: 400px; padding: var(--space-8) var(--space-4); display: grid; gap: var(--space-4); align-content: center; }

/* DEC-UX-005: logotipo apilado, 200px en escritorio y 168px en móvil */
.login__logo { margin: 0; display: flex; justify-content: center; }
.login__logo-img { display: block; width: 100%; max-width: 200px; height: auto; mix-blend-mode: multiply; }

/* Pestañas institucionales con subrayado */
.login__tabs { display: flex; border-bottom: 1px solid var(--outline-variant); }
.login__tabs button { flex: 1; height: 48px; border: 0; background: transparent; font: var(--text-label-large); color: var(--on-surface-variant); cursor: pointer; position: relative; }
.login__tabs button[aria-selected="true"] { color: var(--primary); }
.login__tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); }

/* DEC-UX-001: separación vertical de 20px entre campos */
.login__campos { display: grid; gap: calc(var(--space-4) + var(--space-1)); }
.login__entrar { width: 100%; height: 48px; }

.login__linea { margin: 0; font: var(--text-body-small); color: var(--on-surface-variant); }
.login__enlace { border: 0; background: none; padding: 0; color: var(--primary); font: inherit; text-decoration: underline; cursor: pointer; }
.login__aviso { margin: 0; font: var(--text-body-small); color: var(--on-warning-container); background: var(--warning-container); border-radius: var(--shape-corner-small); padding: var(--space-2) var(--space-3); }

@media (max-width: 600px) {
  .login__form { padding: var(--space-6) max(16px, env(safe-area-inset-left, 0px)); }
  .login__logo-img { max-width: 168px; }
}

/* ==== frontend/src/estilos/app.css ==== */
/* ---------- Vistas autenticadas y formularios de sesión ---------- */

.saltar-contenido { position: absolute; left: var(--space-4); top: -100px; z-index: 10; padding: var(--space-2) var(--space-4); background: var(--surface-container-lowest); color: var(--primary); border-radius: var(--shape-corner-small); }
.saltar-contenido:focus { top: var(--space-2); }

.encabezado {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4);
  padding: var(--space-2) var(--space-4); background: var(--surface-container-lowest);
  border-bottom: 1px solid var(--outline-variant);
}
.encabezado__marca { display: flex; flex: none; }
.encabezado__marca img { display: block; width: 84px; height: auto; mix-blend-mode: multiply; }
.encabezado__usuario { margin: 0 0 0 auto; display: grid; text-align: right; min-width: 0; }
.encabezado__nombre { font: var(--text-title-small); color: var(--on-surface); overflow-wrap: anywhere; }
.encabezado__detalle { font: var(--text-body-small); color: var(--on-surface-variant); overflow-wrap: anywhere; }

.boton { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); }
.boton--secundario { background: transparent; color: var(--primary); }
.boton--secundario:hover:not(:disabled) { background: var(--primary-container); }
.boton--peligro { background: transparent; color: var(--error); border-color: var(--error); }
.boton--peligro:hover:not(:disabled) { background: var(--error-container); }

.contenido { width: 100%; max-width: 960px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-12); display: grid; gap: var(--space-4); }
.contenido:focus { outline: none; }
.contenido h1 { margin: 0; font: var(--text-headline-small); color: var(--on-surface); }
.contenido p { margin: 0; }
.texto-secundario { color: var(--on-surface-variant); font: var(--text-body-medium); }

.estado { min-height: 50vh; display: grid; place-items: center; padding: var(--space-6) var(--space-4); }

/* Avisos */
.aviso { margin: 0; padding: var(--space-3) var(--space-4); border-radius: var(--shape-corner-small); font: var(--text-body-medium); }
.aviso--exito { background: var(--success-container); color: var(--on-success-container); }
.aviso--error { background: var(--error-container); color: var(--on-error-container); }
.aviso--info { background: var(--surface-container); color: var(--on-surface); }

/* Campos: errores y área de texto */
.campo__ayuda { font: var(--text-body-small); color: var(--on-surface-variant); }
.campo__error { font: var(--text-body-small); color: var(--error); }
.campo textarea {
  width: 100%; min-width: 0; min-height: 96px; padding: var(--space-3) var(--space-4); resize: vertical;
  font: var(--text-body-large); font-size: max(1rem, 16px); color: var(--on-surface);
  background: var(--surface-container-lowest); border: 1px solid var(--on-surface-variant);
  border-radius: var(--shape-corner-small);
}
.campo textarea:focus-visible { border-color: var(--primary); outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.campo textarea[aria-invalid="true"], .campo__clave:has(input[aria-invalid="true"]) { border-color: var(--error); }

/* Solicitudes de acceso (Admin) */
.lista-solicitudes { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.tarjeta { padding: var(--space-4); background: var(--surface-container-lowest); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); display: grid; gap: var(--space-3); }
.tarjeta h2 { margin: 0; font: var(--text-title-medium); overflow-wrap: anywhere; }
.datos { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: var(--space-1) var(--space-4); font: var(--text-body-medium); }
.datos dt { color: var(--on-surface-variant); }
.datos dd { margin: 0; overflow-wrap: anywhere; }
.acciones { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.form-rechazo { display: grid; gap: var(--space-3); padding-top: var(--space-2); border-top: 1px solid var(--outline-variant); }
.paginacion { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2); }

@media (max-width: 480px) {
  .datos { grid-template-columns: 1fr; }
  .datos dd { margin-bottom: var(--space-2); }
  .acciones .boton { flex: 1; }
}

/* Título del formulario de solicitud de acceso, sobre el diseño de ingreso */
.login__titulo { margin: 0; text-align: center; font: var(--text-title-large); color: var(--on-surface); }
.login__entrar { text-decoration: none; }

/* Vista de ingreso: registro como acción secundaria y pie discreto (design.md D15) */
.login__registro { display: grid; gap: var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--outline-variant); }
.login__registro p { margin: 0; text-align: center; font: var(--text-body-medium); color: var(--on-surface-variant); }
.login__pie { display: grid; justify-items: center; gap: var(--space-1); text-align: center; }
.login__pie .login__linea { text-align: center; }

.login__demo { width: 100%; font: var(--text-body-small); color: var(--on-surface-variant); }
.login__demo summary {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-2);
  cursor: pointer; color: var(--on-surface-variant); text-decoration: underline; text-underline-offset: 2px;
  border-radius: var(--shape-corner-small); list-style: none;
}
.login__demo summary::-webkit-details-marker { display: none; }
.login__demo summary:hover { color: var(--primary); }
.login__demo[open] summary { color: var(--on-surface); }
.login__demo .campo { margin-top: var(--space-1); text-align: left; }
.campo select {
  width: 100%; min-width: 0; height: 44px; padding: 0 var(--space-3);
  font: var(--text-body-medium); font-size: max(1rem, 16px); color: var(--on-surface);
  background: var(--surface-container-lowest); border: 1px solid var(--outline);
  border-radius: var(--shape-corner-small);
}
.campo select:focus-visible { border-color: var(--primary); outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* ==== frontend/src/estilos/eps.css ==== */
/* ---------- Vista de la EP ---------- */
.cargando { padding: var(--space-6); }
.banda-demo { margin: 0; padding: var(--space-2) var(--space-4); background: var(--warning-container); color: var(--on-warning-container); font: var(--text-body-small); text-align: center; }

.eps { min-height: 100vh; background: var(--surface); }

.campana { position: relative; }
.campana__contador { position: absolute; top: 2px; right: 2px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; background: var(--error); color: var(--on-error); font: 700 12px/20px var(--font-sans); }
.campana__panel { position: absolute; right: 0; top: calc(100% + 8px); z-index: 10; width: min(380px, 90vw); max-height: 70vh; overflow: auto; background: var(--surface-container-lowest); color: var(--on-surface); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); box-shadow: 0 8px 24px rgba(20, 36, 58, 0.18); padding: var(--space-3); }
.campana__titulo { margin: 0 0 var(--space-2); font: var(--text-title-small); }
.campana__vacio { margin: 0; color: var(--on-surface-variant); }
.campana__lista { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.campana__item { width: 100%; display: grid; gap: 2px; text-align: left; padding: var(--space-2) var(--space-3); border: 0; border-left: 4px solid var(--primary); border-radius: var(--shape-corner-small); background: var(--surface-container-low); color: var(--on-surface); font: var(--text-body-small); cursor: pointer; }
.campana__item b { font: var(--text-title-small); }
.campana__item small { color: var(--on-surface-variant); }
.campana__item--alerta { border-left-color: var(--error); }
.campana__item--accion { border-left-color: var(--warning); }

.eps__contenido { display: grid; grid-template-columns: minmax(280px, 420px) minmax(0, 1fr); gap: var(--space-6); max-width: 1200px; margin: 0 auto; padding: var(--space-6); }
.eps__contenido--una-columna { grid-template-columns: minmax(0, 760px); justify-content: center; }
.eps__lista { display: grid; gap: var(--space-3); align-content: start; }
.eps__lista h1 { margin: 0; font: var(--text-headline-small); }
.boton--ancho { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); text-decoration: none; }
.boton--secundario { background: var(--surface-container-lowest); color: var(--primary); }

.filtros { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.filtros button { min-height: 40px; padding: 0 var(--space-3); border: 1px solid var(--outline); border-radius: var(--shape-corner-full); background: var(--surface-container-lowest); color: var(--on-surface); font: var(--text-label-large); cursor: pointer; }
.filtros button[aria-selected="true"] { background: var(--secondary-container); border-color: var(--secondary); }

.lista-tramites { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.tarjeta-tramite { width: 100%; display: grid; gap: var(--space-1); text-align: left; padding: var(--space-4); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); background: var(--surface-container-low); color: var(--on-surface); cursor: pointer; font: inherit; }
.tarjeta-tramite[aria-current="true"] { border: 2px solid var(--primary); background: var(--surface-container-lowest); }
.tarjeta-tramite__codigo { font: var(--text-code-medium); color: var(--on-surface-variant); }
.tarjeta-tramite__fila { display: flex; justify-content: space-between; gap: var(--space-2); align-items: flex-start; }
.tarjeta-tramite__texto { font: var(--text-body-medium); color: var(--on-surface-variant); }

.chip { display: inline-block; padding: 2px var(--space-2); border-radius: var(--shape-corner-extra-small); font: var(--text-label-status); letter-spacing: 0.06em; text-transform: uppercase; white-space: normal; }
.chip--accion { background: var(--warning-container); color: var(--on-warning-container); }
.chip--alerta { background: var(--error-container); color: var(--on-error-container); }
.chip--informacion, .chip--neutro { background: var(--secondary-container); color: var(--on-secondary-container); }
.chip--exito { background: var(--success-container); color: var(--on-success-container); }

.eps__detalle { min-width: 0; }
.eps__sin-seleccion { display: grid; place-items: center; gap: var(--space-2); padding: var(--space-8); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-large); background: var(--surface-container-lowest); color: var(--on-surface-variant); text-align: center; }
.eps__sin-seleccion .ms { font-size: 40px; }
.vacio { color: var(--on-surface-variant); }

.ficha { display: grid; gap: var(--space-4); padding: var(--space-6); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-large); background: var(--surface-container-lowest); }
.ficha__cabecera h2 { margin: 0 0 var(--space-2); font: var(--text-title-large); }
.ficha__cabecera p { margin: 0 0 var(--space-1); }
.ficha__codigo { font: var(--text-code-medium); color: var(--on-surface-variant); }
.ficha__resumen { color: var(--on-surface-variant); }
.ficha__bloque { display: grid; gap: var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--outline-variant); }
.ficha__bloque h3 { margin: 0; font: var(--text-title-medium); }
.ficha__bloque p { margin: 0; }
.ficha__bloque--accion { padding: var(--space-4); border: 2px solid var(--warning); border-radius: var(--shape-corner-medium); background: var(--warning-container); color: var(--on-warning-container); }
.ficha__formulario { display: grid; gap: var(--space-3); }
.ficha__botones { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.ficha__datos { display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-4); margin: 0; }
.ficha__datos dt { color: var(--on-surface-variant); }
.ficha__datos dd { margin: 0; font-weight: 600; }
.ficha__ayuda summary { cursor: pointer; color: var(--primary); min-height: 44px; display: flex; align-items: center; }
.ficha__ayuda ul { margin: 0; padding-left: var(--space-6); display: grid; gap: var(--space-2); font: var(--text-body-medium); }

.aviso { margin: 0; padding: var(--space-3) var(--space-4); border-radius: var(--shape-corner-medium); border-left: 6px solid; font: var(--text-body-medium); }
.aviso p { margin: 0 0 var(--space-1); }
.aviso--alerta { background: var(--error-container); color: var(--on-error-container); border-color: var(--error); }
.aviso--exito { background: var(--success-container); color: var(--on-success-container); border-color: var(--success); }
.aviso--informacion { background: var(--primary-container); color: var(--on-primary-container); border-color: var(--primary); }

.avance { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.avance__paso { display: flex; align-items: center; gap: var(--space-3); color: var(--on-surface-variant); }
.avance__marca { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: var(--shape-corner-full); border: 2px solid var(--outline); font: 700 13px/1 var(--font-sans); }
.avance__paso--hecha .avance__marca { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.avance__paso--actual { color: var(--on-surface); font-weight: 700; }
.avance__paso--actual .avance__marca { border-color: var(--primary); color: var(--primary); }

.documentos { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.documentos li { display: flex; gap: var(--space-3); align-items: flex-start; }
.documentos li > span:last-child { display: grid; }
.documentos small { color: var(--on-surface-variant); font: var(--text-body-small); }

.asistente { display: grid; gap: var(--space-4); }
.asistente h1 { margin: 0; font: var(--text-headline-small); }
.asistente__base { margin: 0; color: var(--on-surface-variant); }
.enlace-volver { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--primary); min-height: 44px; }
.pasos-asistente { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--space-2); }
.pasos-asistente li { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3); border-radius: var(--shape-corner-full); background: var(--surface-container); color: var(--on-surface-variant); font: var(--text-label-large); }
.pasos-asistente li.actual { background: var(--primary); color: var(--on-primary); }
.pasos-asistente li.hecho { background: var(--success-container); color: var(--on-success-container); }
.asistente__paso { display: grid; gap: var(--space-4); }
.asistente__campos { gap: calc(var(--space-4) + var(--space-1)); }
.asistente__campos textarea, .asistente__campos select { width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--on-surface-variant); border-radius: var(--shape-corner-small); font: var(--text-body-large); font-size: max(1rem, 16px); background: var(--surface-container-lowest); }
.asistente__campos select { height: 48px; padding: 0 var(--space-4); }
.pregunta { margin: 0; padding: var(--space-3) var(--space-4); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); display: grid; gap: var(--space-2); }
.pregunta legend { font: var(--text-title-small); padding: 0 var(--space-1); }
.opcion { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; cursor: pointer; }
.opcion input { width: 20px; height: 20px; accent-color: var(--primary); }
.requisitos { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.requisitos__item { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); }
.requisitos__item--listo { border-color: var(--success); background: var(--success-container); }
.requisitos__item .campo input[type="file"] { height: auto; padding: var(--space-2); }
.asistente__botones { display: flex; justify-content: flex-end; gap: var(--space-2); }

@media (max-width: 760px) {
  .eps__contenido { grid-template-columns: minmax(0, 1fr); padding: var(--space-4); }
}

/* Actualización automática e indicador de silencio */
.actualizacion { margin: 0; display: flex; align-items: center; gap: var(--space-1); font: var(--text-body-small); color: var(--on-surface-variant); }
.actualizacion .ms { font-size: 18px; }
.plazo-barra { height: 10px; border-radius: var(--shape-corner-full); background: var(--surface-container-highest); overflow: hidden; }
.plazo-barra span { display: block; height: 100%; background: var(--primary); }
.plazo-texto { margin: 0; font: var(--text-body-medium); color: var(--on-surface-variant); }
.silencios { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: var(--space-3); }
.silencio { display: grid; gap: var(--space-1); padding: var(--space-3) var(--space-4); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); background: var(--surface-container-low); }
.silencio p { margin: 0; font: var(--text-body-medium); }
.silencio small { font: var(--text-body-small); color: var(--on-surface-variant); }
.silencio--aplica { border: 2px solid var(--success); background: var(--success-container); color: var(--on-success-container); }
.silencio--aplica small { color: var(--on-success-container); }
.silencio__titulo { display: flex; align-items: center; gap: var(--space-2); font: var(--text-title-small) !important; }
.avance__texto { display: grid; }
.avance__texto small { font: var(--text-body-small); color: var(--on-surface-variant); font-weight: 400; }

/* ---------- Cabecera de la EP ---------- */
/* Verde hoja tomado del logotipo (letras U y B). Es decorativo: no lleva texto encima. */
.eps-barra { --verde-hoja: #7cc242; --ancho-diagonal: 36px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: stretch; min-height: 76px;
  background: linear-gradient(90deg, #0b3b75 0%, #164a8a 60%, #1f5596 100%); color: #ffffff; }

/* Franja verde: el contenedor verde y el panel blanco comparten el mismo corte diagonal, desplazado */
.eps-barra__lado { display: flex; padding-right: 10px; background: var(--verde-hoja);
  clip-path: polygon(0 0, 100% 0, calc(100% - var(--ancho-diagonal)) 100%, 0 100%); }
.eps-barra__marca { display: flex; align-items: center; padding: 8px calc(var(--ancho-diagonal) + 20px) 8px 24px; background: #ffffff;
  clip-path: polygon(0 0, 100% 0, calc(100% - var(--ancho-diagonal)) 100%, 0 100%); }
.eps-barra__marca img { display: block; height: 58px; width: auto; }
.eps-barra__marca:focus-visible { outline: 3px solid var(--verde-hoja); outline-offset: -6px; }

.eps-barra__identidad { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 var(--space-6); min-width: 0; }
.eps-barra__empresa { font: 700 18px/24px var(--font-sans); color: #ffffff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.eps-barra__acciones { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-6); }
.eps-barra__separador { width: 1px; height: 32px; background: rgba(255, 255, 255, 0.35); }
.eps-barra__icono, .eps-barra__salir { position: relative; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  border: 0; border-radius: var(--shape-corner-full); background: transparent; color: #ffffff; font: var(--text-label-large); cursor: pointer; padding: 0 var(--space-2); }
.eps-barra__icono:hover, .eps-barra__salir:hover { background: rgba(255, 255, 255, 0.12); }
.eps-barra__icono:focus-visible, .eps-barra__salir:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

@media (max-width: 760px) {
  .eps-barra { --ancho-diagonal: 24px; min-height: 64px; }
  .eps-barra__marca { padding: 6px calc(var(--ancho-diagonal) + 12px) 6px 12px; }
  .eps-barra__marca img { height: 40px; }
  .eps-barra__identidad { padding: 0 var(--space-3); }
  .eps-barra__empresa { font-size: 15px; }
  .eps-barra__acciones { padding: 0 var(--space-3); gap: var(--space-1); }
  .eps-barra__separador { display: none; }
  .eps-barra__salir { font-size: 0; }
  .eps-barra__salir .ms { font-size: 24px; }
}
.pedido-sunass { display: grid; gap: var(--space-1); padding: var(--space-3); border-radius: var(--shape-corner-small); background: var(--surface-container-lowest); color: var(--on-surface); }
.pedido-sunass p { margin: 0; }

/* ==== frontend/src/estilos/sunass.css ==== */
/* ---------- Vistas de las áreas de la Sunass (DRE, SRT, OAJ, GG, CD) ---------- */
.eps-barra__cargo { font: var(--text-body-small); color: rgba(255, 255, 255, 0.85); }

.sunass__contenido { display: grid; grid-template-columns: minmax(300px, 440px) minmax(0, 1fr); gap: var(--space-6); max-width: 1320px; margin: 0 auto; padding: var(--space-6); }
.sunass__columna { display: grid; gap: var(--space-4); align-content: start; min-width: 0; }
.sunass__columna h1 { margin: 0; font: var(--text-headline-small); }
.sunass__columna h2 { margin: 0; font: var(--text-title-medium); }
.sunass__vacio { margin: 0; padding: var(--space-4); border: 1px dashed var(--outline); border-radius: var(--shape-corner-medium); color: var(--on-surface-variant); }

.tabla-envoltura { overflow-x: auto; border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); background: var(--surface-container-lowest); }
.tabla { width: 100%; border-collapse: collapse; font: var(--text-body-small); }
.tabla caption { text-align: left; padding: var(--space-2) var(--space-3); color: var(--on-surface-variant); }
.tabla th, .tabla td { padding: var(--space-2) var(--space-3); text-align: left; border-top: 1px solid var(--outline-variant); vertical-align: top; }
.tabla thead th { background: var(--surface-container); font-weight: 700; border-top: 0; }
.tabla tbody tr[aria-selected="true"] { background: var(--secondary-container); }
.tabla button { min-height: 32px; padding: 0; border: 0; background: none; color: var(--primary); font: var(--text-code-medium); text-decoration: underline; cursor: pointer; }
.dias--alto { color: var(--error); font-weight: 700; }

.accion-area { display: grid; gap: var(--space-3); padding: var(--space-4); border: 2px solid var(--primary); border-radius: var(--shape-corner-medium); background: var(--primary-container); color: var(--on-primary-container); }
.accion-area h3 { margin: 0; font: var(--text-title-medium); }
.accion-area p { margin: 0; }
.accion-area small { font: var(--text-body-small); }
.accion-area__coautoria { display: flex; gap: var(--space-2); flex-wrap: wrap; }

.recorrido { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); }
.recorrido li { display: grid; grid-template-columns: 28px 1fr auto; gap: var(--space-2); align-items: start; padding: var(--space-2) 0; border-bottom: 1px solid var(--outline-variant); font: var(--text-body-small); }
.recorrido li b { font: var(--text-label-large); }
.recorrido li small { display: block; color: var(--on-surface-variant); }
.recorrido__pendiente { color: var(--on-surface); font-weight: 700; }
.recorrido .ms { font-size: 20px; }

@media (max-width: 900px) {
  .sunass__contenido { grid-template-columns: minmax(0, 1fr); padding: var(--space-4); }
}

/* Navegación de la cabecera */
.eps-barra__navegacion { display: flex; gap: var(--space-1); }
.eps-barra__navegacion a { min-height: 44px; display: inline-flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-3); border-radius: var(--shape-corner-full); color: #ffffff; text-decoration: none; font: var(--text-label-large); }
.eps-barra__navegacion a:hover { background: rgba(255, 255, 255, 0.12); }
.eps-barra__navegacion a[aria-current="page"] { background: rgba(255, 255, 255, 0.2); box-shadow: inset 0 -3px 0 #7cc242; }
.eps-barra__navegacion a:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

/* ---------- Panel gerencial ---------- */
.panel { display: grid; gap: var(--space-5, 20px); max-width: 1320px; margin: 0 auto; padding: var(--space-6); }
.panel__titulo h1 { margin: 0 0 var(--space-1); font: var(--text-headline-small); }
.panel__titulo p { margin: 0; color: var(--on-surface-variant); }
.panel__bloque { display: grid; gap: var(--space-3); align-content: start; padding: var(--space-5, 20px); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-large); background: var(--surface-container-lowest); min-width: 0; }
.panel__bloque h2 { margin: 0; font: var(--text-title-medium); }
.panel__bloque > p { margin: 0; }
.panel__controles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: var(--space-3); align-items: end; }
.panel__controles input[type="file"] { height: auto; padding: var(--space-2); }
.panel__controles select { width: 100%; height: 48px; padding: 0 var(--space-3); border: 1px solid var(--on-surface-variant); border-radius: var(--shape-corner-small); font: var(--text-body-large); background: var(--surface-container-lowest); }
.panel__botones { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.panel__dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: var(--space-5, 20px); }

.indicadores { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: var(--space-3); }
.indicador { display: grid; gap: 2px; padding: var(--space-4); border: 1px solid var(--outline-variant); border-left: 6px solid var(--primary); border-radius: var(--shape-corner-medium); background: var(--surface-container-lowest); }
.indicador > span { display: flex; align-items: center; gap: var(--space-1); font: var(--text-label-large); color: var(--on-surface-variant); }
.indicador b { font: 700 32px/40px var(--font-sans); color: var(--on-surface); }
.indicador small { font: var(--text-body-small); color: var(--on-surface-variant); }
.indicador--accion { border-left-color: var(--warning); }
.indicador--alerta { border-left-color: var(--error); }
.indicador .ms { font-size: 18px; }
.chip .ms { font-size: 14px; vertical-align: -2px; text-transform: none; letter-spacing: normal; }

/* Barras horizontales: una sola serie, un solo tono; el valor va en texto, no en color */
.barras { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.barras__fila { display: grid; grid-template-columns: 110px 1fr 48px; gap: var(--space-2); align-items: center; padding: 2px 0; }
.barras__fila:hover { background: var(--surface-container-low); }
.barras__etiqueta { font: var(--text-label-large); color: var(--on-surface); }
.barras__pista { height: 16px; border-bottom: 1px solid var(--outline-variant); }

@media (max-width: 900px) {

/* ---------- Bandeja de acción (lista + ficha + tarjetas de plazo) ---------- */
.bandeja { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: var(--space-6); max-width: 1440px; margin: 0 auto; padding: var(--space-6); align-items: start; }
.bandeja__lista { display: grid; gap: var(--space-3); align-content: start; }
.bandeja__lista h1 { margin: 0; font: var(--text-headline-small); }
.bandeja__detalle { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); gap: var(--space-4); align-items: start; padding: var(--space-5, 20px); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-large); background: var(--surface-container-lowest); }

.orden { display: inline-flex; border: 1px solid var(--outline); border-radius: var(--shape-corner-full); overflow: hidden; width: fit-content; }
.orden button { min-height: 44px; padding: 0 var(--space-4); display: inline-flex; align-items: center; gap: var(--space-1); border: 0; background: var(--surface-container-lowest); color: var(--on-surface); font: var(--text-label-large); cursor: pointer; }
.orden button + button { border-left: 1px solid var(--outline); }
.orden button[aria-pressed="true"] { background: var(--secondary-container); }
.orden .ms { font-size: 18px; }

.lista-exp { list-style: none; margin: 0; padding: var(--space-2); display: grid; gap: var(--space-1); border-radius: var(--shape-corner-medium); background: var(--surface-container-low); }
.lista-exp__item { width: 100%; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "codigo marca" "nombre marca"; gap: 2px var(--space-2); align-items: center; padding: var(--space-3); border: 0; border-radius: var(--shape-corner-small); background: transparent; color: var(--on-surface); text-align: left; font: inherit; cursor: pointer; }
.lista-exp__item:hover { background: var(--surface-container); }
.lista-exp__item[aria-current="true"] { background: var(--secondary-container); box-shadow: inset 4px 0 0 var(--primary); }
.lista-exp__codigo { grid-area: codigo; font: var(--text-code-medium); color: var(--on-surface-variant); }
.lista-exp__item b { grid-area: nombre; }
.lista-exp__item .chip, .lista-exp__donde { grid-area: marca; }
.lista-exp__donde { font: var(--text-label-large); color: var(--on-surface-variant); }
.enlace-boton { justify-self: start; min-height: 44px; padding: 0 var(--space-2); border: 0; background: none; color: var(--primary); font: var(--text-label-large); text-decoration: underline; cursor: pointer; }

.ficha-dre { display: grid; gap: var(--space-4); min-width: 0; }
.ficha-dre__titulo { margin: 0; font: var(--text-title-large); }
.ficha-dre__codigo { font: var(--text-code-medium); font-size: 1.1em; margin-right: var(--space-2); }
.ficha-dre__documentos { display: grid; gap: var(--space-2); }
.ficha-dre__documentos h3 { margin: 0; font: var(--text-title-medium); }
.ficha-dre .ficha__resumen { margin: var(--space-1) 0 0; }

.accion-banner { display: grid; gap: var(--space-2); margin: 0; padding: var(--space-4); border-radius: var(--shape-corner-medium); background: var(--primary-container); color: var(--on-primary-container); }
.accion-banner p { margin: 0; }
.accion-banner__titulo { font: var(--text-title-medium); }
.accion-banner--neutro { background: var(--surface-container); color: var(--on-surface); }
.accion-banner--hecho { display: flex; align-items: center; gap: var(--space-2); background: var(--success-container); color: var(--on-success-container); }
.accion-banner .boton { display: inline-flex; align-items: center; gap: var(--space-2); }

.etapas { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-1); }
.etapas__paso { position: relative; display: grid; justify-items: center; gap: 4px; text-align: center; font: var(--text-body-small); color: var(--on-surface-variant); }
.etapas__paso::before { content: ""; position: absolute; top: 15px; left: -50%; width: 100%; height: 2px; background: var(--outline-variant); z-index: 0; }
.etapas__paso:first-child::before { display: none; }
.etapas__paso--hecha::before, .etapas__paso--actual::before { background: var(--primary); }
.etapas__marca { position: relative; z-index: 1; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--shape-corner-full); border: 2px solid var(--outline); background: var(--surface-container-lowest); font: 700 13px/1 var(--font-sans); }
.etapas__paso--hecha .etapas__marca { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.etapas__paso--actual { color: var(--on-surface); font-weight: 700; }
.etapas__paso--actual .etapas__marca { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 3px var(--primary-container); }
.etapas__texto { font: var(--text-label-medium, 600 12px/16px var(--font-sans)); }
.etapas small { color: var(--on-surface-variant); font-weight: 400; }

.historial { border-radius: var(--shape-corner-medium); background: var(--surface-container-low); }
.historial summary { min-height: 44px; display: flex; align-items: center; padding: 0 var(--space-4); font: var(--text-title-small); cursor: pointer; }
.historial .recorrido { padding: 0 var(--space-4) var(--space-3); }

.tarjetas-tiempo { display: grid; gap: var(--space-3); }
.tarjeta-tiempo { display: grid; gap: var(--space-2); padding: var(--space-4); border-radius: var(--shape-corner-medium); background: var(--surface-container-low); }
.tarjeta-tiempo h3 { margin: 0; font: var(--text-title-small); }
.tarjeta-tiempo p { margin: 0; }
.tarjeta-tiempo__paso { color: var(--on-surface-variant); font: var(--text-body-medium); }
.tarjeta-tiempo__vence { font: var(--text-title-medium); }
.tarjeta-tiempo__cifra { font: 700 22px/28px var(--font-sans); }
.tarjeta-tiempo small { font: var(--text-body-small); color: var(--on-surface-variant); }
.tarjeta-tiempo__datos { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--space-3); margin: 0; font: var(--text-body-medium); }
.tarjeta-tiempo__datos dt { color: var(--on-surface-variant); }
.tarjeta-tiempo__datos dd { margin: 0; font-weight: 600; }
.barra-tiempo { height: 8px; border-radius: var(--shape-corner-full); background: var(--surface-container-highest); overflow: hidden; }
.barra-tiempo span { display: block; height: 100%; border-radius: var(--shape-corner-full); }
.barra-tiempo--bien span { background: var(--success); }
.barra-tiempo--alerta span { background: var(--warning); }
.barra-tiempo--vencido span { background: var(--error); }

@media (max-width: 1200px) {
  .bandeja__detalle { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .bandeja { grid-template-columns: minmax(0, 1fr); padding: var(--space-4); }
  .etapas { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: var(--space-3); }
  .etapas__paso::before { display: none; }
}

/* Requisitos del TUPA en la ficha de la DRE */
.requisitos-tupa { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); }

.requisitos-tupa h3 { margin: 0; font: var(--text-title-small); }
.requisitos-tupa p { margin: 0; }
.requisitos-tupa ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); }
.requisitos-tupa li { display: flex; gap: var(--space-2); align-items: flex-start; font: var(--text-body-medium); }
.requisitos-tupa li small { font: var(--text-body-small); }
.requisitos-tupa .ms { font-size: 20px; }
.banda-demo__boton { min-height: 32px; padding: 0 var(--space-1); border: 0; background: none; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }

/* Formar equipo (SRT) */
.equipo { margin: 0; padding: 0; border: 0; display: grid; gap: var(--space-2); }
.equipo legend { padding: 0 0 var(--space-2); font: var(--text-label-large); }
.equipo__opcion { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3); border: 1px solid var(--outline); border-radius: var(--shape-corner-medium); background: var(--surface-container-lowest); color: var(--on-surface); cursor: pointer; }
.equipo__opcion--marcada { border: 2px solid var(--primary); }
.equipo__opcion input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--primary); flex: none; }
.equipo__opcion span { display: grid; gap: 2px; }
.equipo__opcion b { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.equipo__opcion small { color: var(--on-surface-variant); font: var(--text-body-small); }
.equipo-asignado { display: flex; gap: var(--space-2); align-items: flex-start; margin: 0; padding: var(--space-2) var(--space-3); border-radius: var(--shape-corner-small); background: var(--surface-container-low); font: var(--text-body-medium); }

/* Decisiones del equipo SRT y oficio de la SRT */
.accion-banner textarea { width: 100%; padding: var(--space-3); border: 1px solid var(--on-surface-variant); border-radius: var(--shape-corner-small); font: var(--text-body-large); background: var(--surface-container-lowest); }
.oficio-borrador { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: 1px dashed var(--outline); border-radius: var(--shape-corner-small); background: var(--surface-container-lowest); color: var(--on-surface); }
.oficio-borrador ul { margin: 0; padding-left: var(--space-6); }

/* Revisión con el copiloto (RAG) */
.copiloto { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: 1px solid var(--outline); border-radius: var(--shape-corner-medium); background: var(--surface-container-lowest); color: var(--on-surface); }
.copiloto__cabecera { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-2); }
.copiloto__cabecera h4 { margin: 0; display: flex; align-items: center; gap: var(--space-2); font: var(--text-title-small); }
.copiloto__aviso { margin: 0; font: var(--text-body-small); color: var(--on-surface-variant); }
.copiloto__lista { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.copiloto__item { display: grid; gap: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--outline-variant); }
.copiloto__punto { margin: 0; display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.copiloto__cita { margin: 0; padding: var(--space-2) var(--space-3); border-left: 4px solid var(--primary); background: var(--surface-container-low); font: var(--text-body-medium); }
.copiloto__cita footer { margin-top: var(--space-1); font: var(--text-body-small); color: var(--on-surface-variant); }
.copiloto__motivo, .copiloto__decision { margin: 0; font: var(--text-body-small); color: var(--on-surface-variant); }
.copiloto__decision { display: flex; align-items: center; gap: var(--space-1); color: var(--on-surface); }
.copiloto__borrador summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--primary); font: var(--text-label-large); }
.copiloto__borrador pre { margin: 0 0 var(--space-2); padding: var(--space-3); white-space: pre-wrap; font: var(--text-body-small); background: var(--surface-container-low); border-radius: var(--shape-corner-small); }

/* ---------- Expedientes · revisar con copiloto ---------- */
.copiloto-vista { display: grid; gap: var(--space-4); max-width: 1440px; margin: 0 auto; padding: var(--space-6); }
.copiloto-vista__titulo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--space-3); }
.copiloto-vista__titulo h1 { margin: 0; font: var(--text-headline-small); }
.copiloto-vista__titulo p { margin: var(--space-1) 0 0; color: var(--on-surface-variant); }
.copiloto-vista__acciones { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.copiloto-vista__acciones .boton { display: inline-flex; align-items: center; gap: var(--space-2); }
.copiloto-vista__cuerpo { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(0, 1.1fr); gap: var(--space-5, 20px); align-items: start; }

.indispensable { display: grid; gap: var(--space-3); }
.indispensable__cabecera { display: grid; gap: var(--space-2); padding: var(--space-4); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); background: var(--surface-container-lowest); }
.indispensable__cabecera h2 { margin: 0; font: var(--text-title-large); }
.indispensable__cabecera p { margin: 0; color: var(--on-surface-variant); font: var(--text-body-medium); }
.indispensable__lista { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }

.punto { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); background: var(--surface-container-lowest); }
.punto[aria-current="true"] { border: 2px solid var(--primary); }
.punto--no-encontrado { background: var(--error-container); border-color: var(--error); }
.punto__abrir { display: grid; grid-template-columns: 120px 1fr; gap: var(--space-2); align-items: baseline; padding: 0; border: 0; background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; min-height: 32px; }
.punto__estado { font: var(--text-label-large); }
.punto--encontrado .punto__estado { color: var(--success); }
.punto--parcial .punto__estado { color: var(--on-warning-container); }
.punto--no-encontrado .punto__estado { color: var(--on-error-container); }
.punto__titulo { font: var(--text-title-small); }
.punto__etiquetas { display: flex; flex-wrap: wrap; gap: var(--space-2); }

.punto__etiqueta--encontrado { background: var(--success-container); color: var(--on-success-container); }
.punto__etiqueta--parcial { background: var(--warning-container); color: var(--on-warning-container); }

.punto__base { color: var(--on-surface-variant); font: var(--text-body-small); }
.punto__botones { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.punto__registro { margin: 0; display: flex; align-items: center; gap: var(--space-1); font: var(--text-body-small); color: var(--on-success-container); }
.punto__registro .ms { font-size: 16px; }

.visor { position: sticky; top: var(--space-4); display: grid; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-medium); background: var(--surface-container-low); }
.visor__barra { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--shape-corner-small); background: var(--surface-container-lowest); }
.visor__nombre { display: grid; flex: 1; }
.visor__nombre small { color: var(--on-surface-variant); font: var(--text-body-small); }
.visor__zoom { min-width: 36px; min-height: 36px; border: 1px solid var(--outline-variant); border-radius: var(--shape-corner-small); background: var(--surface-container-lowest); color: var(--on-surface); font: 700 18px/1 var(--font-sans); cursor: pointer; }
.visor__hoja { min-height: 320px; padding: var(--space-6); border-radius: var(--shape-corner-small); background: #ffffff; color: #1d2733; box-shadow: 0 2px 10px rgba(20, 36, 58, 0.12); font-family: var(--font-sans); line-height: 1.6; }

.visor__pagina { margin: var(--space-6) 0 0; text-align: center; color: #5a6675; font-size: 0.85em; }
.visor__pie { margin: 0; padding: var(--space-2) var(--space-3); border-radius: var(--shape-corner-small); background: var(--surface-container-lowest); font: var(--text-body-small); }

.preguntar { display: grid; gap: var(--space-3); }
.preguntar__formulario { display: grid; gap: var(--space-2); }

@media (max-width: 1000px) {
  .copiloto-vista__cuerpo { grid-template-columns: minmax(0, 1fr); }
  .visor { position: static; }
}

/* ===== Solo prototipo: clases que el frontend usa sin regla CSS, y el guion de la demo ===== */

.prototipo-ejemplo { margin-top: var(--space-2); }

.guion-abrir { position: fixed; right: 16px; bottom: 16px; z-index: 50; min-height: 48px; display: inline-flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); border: 0; border-radius: var(--shape-corner-full); background: var(--primary); color: var(--on-primary); font: var(--text-label-large); box-shadow: var(--elevation-3); cursor: pointer; }
.guion { position: fixed; right: 16px; bottom: 16px; z-index: 50; width: min(420px, calc(100vw - 32px)); display: grid; gap: var(--space-2); padding: var(--space-4); border-radius: var(--shape-corner-large); border-top: 4px solid #7cc242; background: var(--inverse-surface); color: var(--inverse-on-surface); box-shadow: var(--elevation-3); font: var(--text-body-medium); }
.guion p { margin: 0; }
.guion__cabecera { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
.guion__paso { font: var(--text-label-status); letter-spacing: 0.06em; text-transform: uppercase; color: #a8d98a; }
.guion__icono { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; border-radius: var(--shape-corner-full); background: transparent; color: inherit; cursor: pointer; }
.guion__icono:hover { background: rgba(255, 255, 255, 0.12); }
.guion__titulo { font: var(--text-title-medium); }
.guion__cuenta { display: flex; align-items: center; gap: var(--space-1); font: var(--text-label-medium); color: var(--inverse-primary); }
.guion__cuenta .ms { font-size: 18px; }
.guion__destacar { padding: var(--space-2) var(--space-3); border-left: 3px solid #7cc242; background: rgba(255, 255, 255, 0.06); border-radius: var(--shape-corner-small); }
.guion__botones { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; }
.guion__botones select { min-width: 0; height: 36px; border-radius: var(--shape-corner-small); border: 1px solid var(--outline); background: var(--surface-container-lowest); color: var(--on-surface); font: var(--text-body-small); }
.guion .boton--secundario { background: transparent; color: var(--inverse-on-surface); border-color: var(--inverse-on-surface); }
.guion .boton:disabled { opacity: 0.4; cursor: default; }
.aviso-flotante { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; max-width: min(560px, calc(100vw - 32px)); padding: var(--space-3) var(--space-4); border-radius: var(--shape-corner-medium); background: var(--inverse-surface); color: var(--inverse-on-surface); font: var(--text-body-medium); box-shadow: var(--elevation-3); }
@media (max-width: 900px) {
  .historial__cuerpo { grid-template-columns: minmax(0, 1fr); }
  .movimiento { width: auto; }
  .plazos-area li { grid-template-columns: minmax(0, 1fr) auto; }
  .plazos-area__barra { grid-column: 1 / -1; grid-row: 2; }
}

</style>

/* ---------- Acciones (servicio.js) ---------- */
function siguienteNumero(prefijo, ancho) {
  let max = 0;
  const re = new RegExp("^" + prefijo.replace(/[-]/g, "\\-") + "(\\d+)$");
  estado.expedientes.forEach((e) => { const m = e.codigo.match(re); if (m) max = Math.max(max, +m[1]); e.hitos.forEach((h) => { const k = h.doc && h.doc.match(re); if (k) max = Math.max(max, +k[1]); }); e.documentos.forEach((d) => { const k = d.numero.match(re); if (k) max = Math.max(max, +k[1]); }); });
  return prefijo + String(max + 1).padStart(ancho, "0");
}
function nuevoDocumento(e, tipo, numero, asunto, acceso, hito, req) {
  let max = 0; estado.expedientes.forEach((x) => x.documentos.forEach((d) => { max = Math.max(max, +d.codigo.slice(4)); }));
  const d = D("DOC-" + String(max + 1).padStart(6, "0"), tipo, numero, hoy(), asunto, acceso, hito, req);
  e.documentos.push(d); return d;
}
function avanzar(e, siguiente, por, doc) {
  const p = pasoActual(e); p.fin = hoy(); p.por = por || null; if (doc) p.doc = doc;
  if (siguiente) e.hitos.push(H(siguiente, hoy(), null));
}
const anio = () => hoy().slice(0, 4);
function completarGenerico(e, por) {

  if (p.c === "derivacion") nuevoDocumento(e, "proveido", "Proveído", "La Dirección de Regulación Económica deriva el expediente a la Subdirección de Regulación Tarifaria", "interno", "derivacion");
  if (p.c === "informe") { doc = siguienteNumero(`INF-${anio()}-`, 4); nuevoDocumento(e, "informe", doc, "Informe técnico-legal y proyecto de resolución", "interno", "informe"); }
  if (p.c === "memo_gg") { doc = siguienteNumero(`MEM-${anio()}-`, 4); nuevoDocumento(e, "memorandum", doc, "La Dirección de Regulación Económica eleva el informe a la Gerencia General", "interno", "memo_gg"); }
  const sig = siguienteCodigo(p.c);

}
function formarEquipo(e, ids, por) {

/* ---------- Copiloto simulado (contrato: evaluaciones-requisitos) ---------- */
function evaluarConCopiloto(e) {
  const doc = (r) => e.documentos.find((d) => d.req === r);
  const motivo = (e.motivo || "un evento imprevisto").toLowerCase();
  const res = [];
  const d1 = doc("UFI-R01");
  res.push(d1 ? { req: "UFI-R01", estado: "evidencia_encontrada", cita: { doc: d1.codigo, pagina: 2, fragmento: `Motivo de la solicitud: ${motivo}. El evento se produjo por caso fortuito o de fuerza mayor.` }, motivo: "El pasaje describe el evento y lo califica como caso fortuito o de fuerza mayor.", verificada: true }
    : { req: "UFI-R01", estado: "no_hallada", motivo: "No se encontró un informe que describa el caso fortuito o de fuerza mayor." });
  const d2 = doc("UFI-R02");
  res.push(d2 ? { req: "UFI-R02", estado: "evidencia_encontrada", cita: { doc: d2.codigo, pagina: 1, fragmento: "Se adjunta el presupuesto con los costos unitarios y el cronograma de ejecución." }, motivo: "El documento contiene presupuesto, costos unitarios y cronograma.", verificada: true }
    : { req: "UFI-R02", estado: "no_hallada", motivo: "No se encontró un documento con el sustento de la propuesta (presupuesto, costos unitarios o cronograma)." });
  const d3 = doc("UFI-R03");
  res.push(d3 ? { req: "UFI-R03", estado: "evidencia_parcial", cita: { doc: d3.codigo, pagina: 1, fragmento: "Se propone la reposición de los recursos utilizados al fondo de inversiones." }, motivo: "Menciona la reposición, pero no precisa si es devolución total o parcial: confirmar a mano.", verificada: false }
    : { req: "UFI-R03", estado: "no_hallada", motivo: "No se encontró la propuesta de devolución o de exoneración." });
  const faltan = res.filter((r) => r.estado === "no_hallada");
  const borrador = "BORRADOR (requiere revisión y firma del especialista)\n\n" + (faltan.length
    ? faltan.map((r) => { const q = REQUISITOS.find((x) => x.c === r.req); return `· ${q.descripcion} (${q.base}): ${r.motivo}`; }).join("\n")
    : "No se identificaron requisitos faltantes.");
  e.copiloto = { resultados: res, borrador, decisiones: {} };
  return e.copiloto;
}
function responderPregunta(e, pregunta) {
  const docs = e.documentos.filter((d) => d.tipo === "anexo" || d.tipo === "carta_ep");
  if (!docs.length) return { estado: "sin_evidencia", respuesta: "No hay documentos indexados para responder." };

    case "guion-abrir": guionIr(1); break;
    case "guion-siguiente": guionIr(estado.guion + 1); break;
    case "guion-anterior": guionIr(estado.guion - 1); break;
    case "guion-salir": estado.guion = null; guardar(); render(); break;
    case "guion-ocultar": ui.guionOculto = true; render(); break;
    case "guion-mostrar": ui.guionOculto = false; render(); break;
  }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "cuenta-demo") { const c = CUENTAS.find((x) => x.id === t.value); if (!c) return; ui.cuentaElegida = c.id; ui.tab = c.institucion; ui.error = ""; render(); return; }
  if (t.id === "guion-paso") { guionIr(+t.value); return; }
  if (t.dataset.requisito) { if (t.files[0]) ui.nueva.archivos[t.dataset.requisito] = t.files[0].name; else delete ui.nueva.archivos[t.dataset.requisito]; render(); return; }
  if (t.dataset.especialista) { const id = t.dataset.especialista; ui.equipoMarcados = t.checked ? [...ui.equipoMarcados, id] : ui.equipoMarcados.filter((x) => x !== id); render(); return; }
  if (t.dataset.observado) { const r = t.dataset.observado; ui.observados = t.checked ? [...ui.observados, r] : ui.observados.filter((x) => x !== r); render(); return; }
  if (t.name === "verif") { ui.verif = t.value; if (t.value === "no" && !ui.observados.length) ui.observados = REQUISITOS.filter((r) => !buscar(ui.sel.sunass).documentos.some((d) => d.req === r.c)).map((r) => r.c); render(); return; }
  if (t.name === "eval") { ui.eval = t.value; render(); return; }
  if (t.id === "corte") { ui.corte = t.value; render(); return; }
  if (t.id === "dias-alerta") { ui.diasAlerta = Math.min(30, Math.max(1, +t.value || 1)); render(); return; }
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.name === "asunto") ui.nueva.asunto = t.value;
  if (t.id === "detalle-obs") ui.detalleObs = t.value;
  if (t.id === "detalle-pedido") ui.detallePedido = t.value;
  if (t.id === "plazo-pedido") ui.plazoPedido = +t.value;
});
document.addEventListener("submit", (ev) => {
  ev.preventDefault(); const f = ev.target; const c = cuenta();
  if (f.id === "form-ingreso") {
    const usuario = f.usuario.value.trim().toLowerCase(); const ruc = f.ruc ? f.ruc.value.trim() : "";
    if (!usuario || !f.clave.value || (f.ruc && !ruc)) { ui.error = "Complete todos los campos."; render(); return; }
    const k = CUENTAS.find((x) => x.usuario === usuario && x.institucion === ui.tab && (x.institucion !== "eps" || x.ruc === ruc));
    if (!k) { ui.error = "No se pudo iniciar sesión. Intente de nuevo."; render(); return; }
    estado.sesion = { cuenta: k.id }; limpiarUi(); ui.cuentaElegida = null; guardar(); location.hash = inicioDe(k); return;
  }
  if (f.id === "form-acceso") { ui.solicitudEnviada = true; render(); return; }
  if (f.id === "form-nueva") {
    if (!ui.nueva.asunto.trim()) { ui.error = "Escriba el asunto de la solicitud."; render(); return; }
    const e = crearSolicitud(c.eps, ui.nueva.asunto.trim(), REQUISITOS.map((r) => r.c).filter((r) => ui.nueva.archivos[r]));
    ui.constancia = e.codigo; ui.sel.ep = e.codigo; ui.error = ""; guardar(); render(); return;
  }
  if (f.id === "form-respuesta") {
    const faltan = [...f.querySelectorAll("input[type=file]")].filter((i) => !i.files.length && !(ui.ejemplos || {})[i.dataset.archivo]);
    if (faltan.length) { faltan.forEach((i) => i.setAttribute("aria-invalid", "true")); avisar("Adjunte el PDF de cada requisito observado."); return; }
    ui.mensajeEp = responderPedido(buscar(f.dataset.codigo), {}); ui.ejemplos = {}; guardar(); render(); return;
  }
  if (f.id === "form-equipo") {
    const roles = ui.equipoMarcados.map((id) => ESPECIALISTAS.find((s) => s.id === id).rol);
    if (!roles.includes("verifica_tupa") || !roles.includes("evalua_informa")) { ui.errorAccion = "Elija al menos una persona que verifique y una que evalúe."; render(); return; }
    actuar((e) => formarEquipo(e, ui.equipoMarcados, por(c.id))); return;
  }
  if (f.id === "form-verificacion") {
    if (!ui.verif) { ui.errorAccion = "Indique si la solicitud cumple los requisitos."; render(); return; }
    if (ui.verif === "no" && (!ui.observados.length || !ui.detalleObs.trim())) { ui.errorAccion = "Marque los requisitos observados y escriba el detalle."; render(); return; }
    actuar((e) => registrarVerificacion(e, ui.verif === "si", ui.observados, ui.detalleObs.trim())); return;
  }
  if (f.id === "form-evaluacion") {
    if (!ui.eval) { ui.errorAccion = "Indique si la información es suficiente."; render(); return; }
    if (ui.eval === "no" && (!ui.detallePedido.trim() || !(ui.plazoPedido >= 1 && ui.plazoPedido <= 10))) { ui.errorAccion = "Escriba qué información necesita y un plazo de 1 a 10 días hábiles."; render(); return; }
    actuar((e) => registrarEvaluacion(e, ui.eval === "si", ui.detallePedido.trim(), ui.plazoPedido)); return;
  }
  if (f.id === "form-pregunta") { ui.respuesta = responderPregunta(buscar(ruta().split("/")[3]), f.pregunta.value); render(); return; }
});
document.addEventListener("keydown", (ev) => {
  if (!estado.guion || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (ev.altKey && ev.key === "ArrowRight" && estado.guion < GUION.length) guionIr(estado.guion + 1);
  if (ev.altKey && ev.key === "ArrowLeft" && estado.guion > 1) guionIr(estado.guion - 1);
});
window.addEventListener("hashchange", render);
cargar();
render();

</script>
